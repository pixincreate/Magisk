name: Update Fork

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 */3 * *" # runs once in 3 days at 05:30 UTC

permissions:
  contents: write
  actions: write

jobs:
  update_fork:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.sync.outputs.sha }}

    steps:
      - name: Checkout Forked Repo
        uses: actions/checkout@v7
        with:
          repository: pixincreate/Magisk
          ref: master
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Git
        run: git config --global user.email ${{ secrets.EMAIL }} && git config --global user.name PiX

      - name: Fetch from Upstream
        id: sync
        run: |
          # Upstream .gitattributes marks /tools/keys/futility as binary, but the
          # ELF lives at /tools/futility. Without this override, the global
          # "* text eol=lf" rule makes git normalize CRLF bytes inside the ELF,
          # which dirties the tree right after checkout and blocks the rebase.
          echo '/tools/futility binary' >> .git/info/attributes
          git remote add upstream https://github.com/topjohnwu/Magisk.git
          git fetch upstream master
          upstream_commit="$(git rev-parse upstream/master)"
          echo "Upstream latest commit: ${upstream_commit}"
          fork_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$upstream_commit" HEAD; then
            if ! git rebase upstream/master; then
              git diff
              echo "ERROR: Rebase failed! Resolve it locally and force-push."
              git rebase --abort || true
              exit 1
            fi
            git submodule update --init --recursive  # Update the submodule
            git push --force-with-lease="refs/heads/master:$fork_commit" origin HEAD:refs/heads/master
            echo "Rebase successful!"
          else
            echo "Fork is synchronized. Continuing to the release check."
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build_app:
    needs: update_fork
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ needs.update_fork.outputs.source_sha }}
    secrets: inherit

# References:
# https://stackoverflow.com/questions/75192546/is-it-possible-to-call-another-workflow-file-from-another-workflow-files-condit/75225285#75225285
# https://stackoverflow.com/questions/75191443/how-to-check-if-upstreams-head-latest-commit-is-present-in-forked-repo
# https://stackoverflow.com/questions/75191328/why-does-git-rebase-upstream-main-behaves-differently-when-used-github-actions
# https://stackoverflow.com/questions/62750603/github-actions-trigger-another-action-after-one-action-is-completed
